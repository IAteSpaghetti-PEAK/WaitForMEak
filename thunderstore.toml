# Thunderstore CLI (tcli) config, used by the release workflow to auto-publish.
# The zip's own manifest.json is authoritative for version/deps; the workflow
# passes --package-version explicitly.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "IAteSpaghetti"
name = "WaitForMEak"
versionNumber = "0.0.0" # overridden with --package-version at publish time
description = "Late joiners are dropped next to the lowest living scout instead of the base camp. Host only."
websiteUrl = "https://github.com/IAteSpaghetti-PEAK/WaitForMEak"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.75301"
# Optional: only draws the settings in the in-game menu. The mod runs fine without it,
# but Thunderstore has no "optional" flag, so it's listed as a normal dependency.
PEAKModding-ModConfig = "1.6.0"

[publish]
repository = "https://thunderstore.io"
communities = ["peak"]
